<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS4 Direct Store</title>
    <style>
        :root {
            --bg-color: #0d0f12;
            --card-bg: #161b22;
            --accent-color: #0070d1;
            --accent-hover: #005aab;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --border-color: #30363d;
            --focus-color: #f0f6fc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 1.8rem;
            color: var(--text-main);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .search-container {
            max-width: 600px;
            margin: 0 auto 25px auto;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 18px;
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 10px rgba(0, 112, 209, 0.3);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, border-color 0.2s;
        }

        .card:hover {
            border-color: var(--focus-color);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .game-info h3 {
            font-size: 1.1rem;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .badge {
            display: inline-block;
            background-color: #21262d;
            color: var(--accent-color);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
        }

        .details {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        .details span {
            display: block;
            margin-bottom: 3px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.95rem;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .no-results {
            text-align: center;
            grid-column: 1 / -1;
            color: var(--text-muted);
            padding: 40px;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>PS4 Direct Store</h1>
        <p class="subtitle">Navegador otimizado para downloads FPKG</p>
    </header>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Pesquisar jogo ou código CUSA..." autofocus>
    </div>

    <div class="grid" id="gameGrid"></div>

    <!-- Puxa o arquivo de configuração externo -->
    <script src="config.js"></script>

    <script>
        const gameGrid = document.getElementById('gameGrid');
        const searchInput = document.getElementById('searchInput');

        function renderGames(filter = '') {
            gameGrid.innerHTML = '';
            
            // Usa a lista vinda de config.js
            const filtered = GAME_CONFIG.filter(game => 
                game.title.toLowerCase().includes(filter.toLowerCase()) || 
                game.cusa.toLowerCase().includes(filter.toLowerCase())
            );

            if (filtered.length === 0) {
                gameGrid.innerHTML = '<div class="no-results">Nenhum jogo encontrado.</div>';
                return;
            }

            filtered.forEach(game => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="game-info">
                        <h3>${game.title}</h3>
                        <span class="badge">${game.cusa}</span>
                        <div class="details">
                            <span>Tipo: ${game.type}</span>
                            <span>Tamanho: ${game.size}</span>
                        </div>
                    </div>
                    <a href="${game.url}" class="btn">BAIXAR .PKG</a>
                `;
                gameGrid.appendChild(card);
            });
        }

        searchInput.addEventListener('input', (e) => {
            renderGames(e.target.value);
        });

        renderGames();
    </script>
</body>
</html>
